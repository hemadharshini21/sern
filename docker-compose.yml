services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      ML_SERVICE_URL: ${ML_SERVICE_URL}
    depends_on:
      - postgres
      - redis
      - ml-service
    networks:
      - sern-network

  ml-service:
    build:
      context: ./ml-service
    ports:
      - "${ML_PORT}:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    networks:
      - sern-network

  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sern-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - sern-network

volumes:
  postgres-data:

networks:
  sern-network:
    driver: bridge
